; Pick which program to build with the env name:  pio run -e node_a -t upload
; In VS Code: click the env name in the blue bottom bar, or use the PlatformIO sidebar.
[platformio]
default_envs = cloud_test

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    https://github.com/sparkfun/SparkFun_ATECCX08a_Arduino_Library.git

[env:cloud_test]
build_src_filter = -<*> +<cloud_test/>

[env:atecc_setup]
build_src_filter = -<*> +<atecc_setup/>

[env:node_a]
build_src_filter = -<*> +<node_a_72h/>

[env:node_b]
build_src_filter = -<*> +<node_b_72h/>

[env:twoway]
build_src_filter = -<*> +<node_twoway/>

[env:compass_test]
build_src_filter = -<*> +<compass_test/>
